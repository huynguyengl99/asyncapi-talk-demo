name: contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - run: npm ci --prefix web

      - name: 1. The committed clients match the code
        run: |
          uv run python scripts/dump_spec.py > "$RUNNER_TEMP/asyncapi.json"
          scripts/sync-clients.sh "$RUNNER_TEMP/asyncapi.json"
          git diff --exit-code clients web/src/generated

      - name: 2. The document is valid AsyncAPI
        run: npx -y @asyncapi/cli validate "$RUNNER_TEMP/asyncapi.json"

      - name: 3. No breaking change against the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          uv run python "$RUNNER_TEMP/base/scripts/dump_spec.py" > "$RUNNER_TEMP/base.json"
          npx -y @asyncapi/cli diff "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/asyncapi.json" \
            --type=breaking -f json -s "$RUNNER_TEMP/breaking.json"
          # asyncapi diff exits 0 even when it finds breaking changes, so check its output.
          jq -e 'length == 0' "$RUNNER_TEMP/breaking.json" || { cat "$RUNNER_TEMP/breaking.json"; exit 1; }

      - name: 4. The frontend still compiles against the clients
        run: npm run --prefix web typecheck
